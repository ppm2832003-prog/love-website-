<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            background: #10101c;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px 15px;
        }
        .profile {
            background: #202038;
            padding: 30px;
            border-radius: 20px;
            max-width: 350px;
            margin: auto;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        h1 {
            color: #00d9ff;
        }
        p {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="profile">
        <img src="https://placehold.co/120x120" alt="Profile">
        <h1>MY PROFILE</h1>
        <p>Welcome to my website!</p>
        <p>I'm learning Web Development.</p>
    </div>
</body>
</html>
