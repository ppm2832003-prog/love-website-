<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>မောင့်အချစ်ဆုံးလေးရေ ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg,#180b20,#390d32,#170c29);
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
}

.card {
    max-width: 420px;
    width: 100%;
    padding: 35px 22px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,120,190,.3);
    border-radius: 25px;
    box-shadow: 0 0 30px #ff248855;
}

.heart {
    font-size: 75px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

h1 {
    color: #ff8ecb;
    font-size: 27px;
}

p {
    color: #f5ddeb;
    line-height: 2;
    font-size: 16px;
}

button {
    background: linear-gradient(90deg,#ff368e,#ff75bd);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-size: 17px;
    margin-top: 15px;
    cursor: pointer;
}

#message {
    display: none;
    color: #ffb5dd;
    margin-top: 25px;
    line-height: 2;
}

.footer {
    color: #dba4c5;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>
<div class="card">

    <div class="heart">❤️</div>

    <h1>မောင့်အချစ်ဆုံးလေးရေ</h1>

    <p>
        မမရေ... 🥺<br
0
